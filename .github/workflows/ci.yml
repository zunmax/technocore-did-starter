name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile technocore_agent.py tests/test_technocore_agent.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check patch whitespace
        run: git diff --check

      - name: Reject tracked private-key files
        shell: bash
        run: |
          if files=$(git ls-files '*.pem' '*.key'); then
            if [[ -n "$files" ]]; then
              echo "Private-key files must not be tracked:"
              echo "$files"
              exit 1
            fi
          else
            exit 1
          fi
